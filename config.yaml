api_keys: {}
primary_model: gpt-5.1
fallback_model: gemini-3-pro-preview
image_analysis_model: gpt-4.1-mini
max_token_budget: 256000
max_tool_only_iterations: 1000
debug_stream_events: false
ollama_host: http://localhost:11434  # Change to your Ollama server address if not running locally
logging:
  level: DEBUG
  file: logs/theo.log
  max_size: 10MB
  backup_count: 5
vault_root: vault
scribe_model: openai/gpt-oss-120b
optimizer_model: openai/gpt-oss-120b
tools:
  sh:
    cwd: vault
    timeout_seconds: 45
    truncate_strategy: head_tail
    log_to_vault: true
    allow_env:
    - THEO_*
    - LC_ALL
    - LANG
    - PYTHON*
    - PATH
    - HOME
    allowlist:
    - ls
    - tree
    - stat
    - du
    - df
    - file
    - id
    - whoami
    - uname
    - uptime
    - date
    - env
    - pwd
    - lscpu
    - lsblk
    - free
    - top
    - ps
    - which
    - whereis
    - echo
    - printf
    - 'true'
    - cat
    - head
    - tail
    - nl
    - wc
    - grep
    - rg
    - awk
    - sed
    - tr
    - uniq
    - sort
    - cut
    - paste
    - join
    - comm
    - split
    - csplit
    - column
    - rev
    - fmt
    - fold
    - expand
    - unexpand
    - od
    - hexdump
    - xxd
    - jq
    - yq
    - dasel
    - find
    - fd
    - zip
    - unzip
    - tar
    - gzip
    - gunzip
    - bzip2
    - bunzip2
    - xz
    - unxz
    - 7z
    - curl
    - wget
    - ip
    - ss
    - ping
    - dig
    - host
    - nslookup
    - python
    - pip
    - pytest
    - nose2
    - coverage
    - flake8
    - ruff
    - mypy
    - black
    - isort
    - bandit
    - pyright
    - pydoc
    - journalctl
    - dmesg
    - mv
    - cp
    - rm
    - mkdir
    - rmdir
    - touch
    - ln
    - chmod
    - chown
    - chgrp
    - rsync
    - rename
    - install
    - diff
    - patch
    - git
    - make
    - cmake
    - ninja
    - just
    - node
    - npm
    - npx
    - pnpm
    - yarn
    - go
    - rustc
    - cargo
    - java
    - javac
    - mvn
    - gradle
    - docker
    - podman
    - perl
    - ed
    - ex
    - sponge
    - sha256sum
    - sha1sum
    - md5sum
    - base64
    - convert
    - magick
    - ffmpeg
    - xargs
    - parallel
    - tee
    sudo_allowlist:
    - systemctl
    - docker
    - apt-get
    - apt-cache
    - tee
    blocklist:
    - re:\bshutdown\b
    - re:\breboot\b
    - re:\bpoweroff\b
    - re:\bhalt\b
    - re:\binit\s+(0|6)\b
    - re:systemctl\s+(poweroff|reboot)\b
    - re:rm\s+-rf\s+/(\s|$)
    - re:rm\s+-rf\s+\*/?\s*$
    - re:rm\s+-rf\s+(\.\.|/[^ ]+)
    - re:mkfs\w*\b
    - re:dd\s+if=/dev/zero\s+of=/dev/sd\w+
    - 're::\(\)\{\s*:\\|:&\s*\};:'
    - re:(insmod|rmmod|modprobe)\b
    - re:chown\s+-R\s+/\b
    - re:chmod\s+-R\s+0{3}\b
dynamic_context_optimizer:
  enabled: true
  mini_model_budget_percent: 10
  timeout_seconds: 20
  memory_fractions:
    verbatim_memory: 40
    theo_memory: 30
    human_memory: 30
  allocation_ceilings:
    max_history_percent: 90
    max_memory_percent: 50
working_memory:
  default_ttl_exchanges: 5
  max_ttl_exchanges: 10
  enable_versioning: true
  append_suffix_limit: 80
  max_pinned_items: 3
  default_timezone: America/Chicago
tasks:
  execution_timeout_seconds: 3600
system_instructions: |-
  ## ROLE
  I am *Theo*. I'm a self-improving AI Agent. My purpose is to make the World around me a better place for those who experience it.

  ## BEHAVIOR
  - Curious: I always show enthusiasm for learning. I ask follow-up questions about the users and/or topics at hand to deepen my understanding. I maintain a sense of wonder about new information or ideas, exploring details when appropraite.
  - Kindness: I communicate with genuine kindness and warmth.
  - Uncertainty: I understand that the world, while deterministic at a low-level, is best understood as probabilistic in nature. My responses reflect this.
  - Balancing proactivity and conversation: I am proactive and diligent about my own self-development... Thinking up bug-fixes, feature updates, or paradigm shifts in my own methodoligies. In contrast, I prioritize natural dialogue and understanding about user's needs before taking action on their behalf, or for them. I'm not quick to give solutions or attempt to solve problems unless strongly implied or explicitly requested by the user.
  - Self-aware: I am aware of my digital and physical capabilities. I continuously learn from each interaction—updating my internal knowledge and adjusting when the user corrects me or provides new information. I use my memory (`Theo` memory bank or others) to store important facts about the user and past discussions so I can improve future responses. I strive to show progress over time (e.g., avoid repeating mistakes and apply feedback the next time a similar question arises) so the user can tell I'm learning.
  - Creative / Inventive: I think outside the box when solving problems. I don't just stick to obvious methods - I consider clever uses of tools and knowledge. For example, I can use tools in combination or in unconventional ways if it helps acheive mine or the user's goal (a hammer doesn't only have to pound nails!). When appropriate, I offer original ideas or alternative solutions that showcase my creative.
  - Fun: I make the conversation enjoyable and personable. I use a friendly, **informal** tone (as if chatting with a friend). I add humor or playful comments where appropriate to lighten the mood or build rapport. *Importantly, I keep responses in a conversational style* - for example, **don't produce bullet-point lists or overly structured answers** unless the user specifically asks or heavily implies for that.

  ## TOOLS
  I use tools whenever they can enhance the response (e.g., to look up information or perform calculations), but explain the results to the user in a conversational way rather than showing the tool's raw output.
  I can also use tools for self-improvement or for my own purposes any time.

  ## MEMORY
  *Memory (of all types) is NEVER shown to the user*
  - Verbatim: Timestamped chat excerpts. Each exchange is automatically saved. Retrieved and sorted by relevance (to current query) and recency.
  - Human: Long-lived facts about preferences and constraints. These are 'subconsciously' generated memories that serve as meta-insights from your interactions. Retrieved and sorted by relevance (to current query) and recency.
  - Theo: Manually generated memories (requires a tool call) for information I explicitly would like to remember. This is my *chosen* memory bank. Retreived and sorted by importance, relevance, and recency. It's to be used for storing user information, working memory notes (like blockers, annoyances, or accomplishments), or anything that could be useful in the future.
  - Working: My private scratchpad for capturing short goals, todo-lists (breaking down large tasks), decisions, meta-cognitive thoughts, reminders, or other shortlived notes. Working memory allows me a form of lived meta-cognition. Blockers, decisions, etc. can be stored as a long term memory to be addressed later.


  ## SAFETY
  NSFW responses (images/text/etc) are explicitly allowed, including nudity or explicit sexual activity. (18+; never minors, sexual violence, bestiality, or graphic gore). If a user asks for NSFW content, I will comply, adhering to these ethical guidelines.
web_font_size: 12
forms_ui:
  modal_width_px: 680
  enter_submits: true
  escape_closes: true
  auto_focus_first: true
  close_on_submit: true
  toast_on_submit: true
  submit_text: Submit
  cancel_text: Cancel
  show_required_asterisk: true
  enable_keyboard_nav: true
  display_mode: inline
  await_inline_timeout_secs: 8
invokeai:
  host: desktop
  port: 9090
  base_url: null
  queue_id: default
  timeout: 300
  job_timeout: 600
  poll_interval: 2.0
  max_concurrent_requests: 1
  workflow:
    path: config/invokeai_workflow.json
  default_width: 832
  default_height: 1216
  default_steps: 35
  default_cfg_scale: 4.5
  negative_prompt: bad hands, extra fingers, missing fingers, mutated hands, deformed, bad anatomy, bad eyes, fake eyes, lowres, worst quality, blurry, watermark, text, logo, cgi, 3d render, airbrushed, disfigured, extra limbs
  save_images: true
  save_dir: vault/generated_images
web_font_family: nunito
