# Enhanced Logging Configuration for Theo
# This file controls logging behavior to reduce verbosity while maintaining useful information

version: 1
disable_existing_loggers: false

filters:
  context:
    (): utils.logger.LogContextFilter
  sanitize:
    (): utils.logger.SanitizingFilter

formatters:
  detailed:
    format: "%(asctime)s [%(levelname)s] [rid=%(request_id)s run=%(run_id)s room=%(room_id)s] %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  
  console:
    format: "%(asctime)s [%(levelname)s] [rid=%(request_id)s run=%(run_id)s room=%(room_id)s] %(message)s"
    datefmt: "%H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: console
    stream: ext://sys.stdout
    filters: [context, sanitize]
  
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/theo.log
    maxBytes: 52428800  # 50MB
    backupCount: 10
    encoding: utf8
    filters: [context, sanitize]

loggers:
  # Layer-specific logging levels
  layer1_chatbot:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  layer2_shortterm:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  layer3_longterm:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  layer4_tools:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  layer5_features:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  # Server components
  server:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  server.worker:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  server.app:
    level: INFO
    handlers: [console, file]
    propagate: false
  
  # Utility modules - more verbose for debugging
  utils.prompt_printer:
    level: WARNING  # Reduce verbosity of prompt building
    handlers: [console, file]
    propagate: false
  
  utils.token_counter:
    level: WARNING  # Reduce token counting verbosity
    handlers: [console, file]
    propagate: false
  
  # External libraries - suppress unless important
  urllib3:
    level: WARNING
    handlers: [console, file]
    propagate: false
  
  requests:
    level: WARNING
    handlers: [console, file]
    propagate: false
  
  asyncio:
    level: WARNING
    handlers: [console, file]
    propagate: false

  uvicorn:
    level: WARNING
    handlers: [console, file]
    propagate: false

  uvicorn.access:
    level: WARNING
    handlers: [console, file]
    propagate: false

  uvicorn.error:
    level: WARNING
    handlers: [console, file]
    propagate: false

root:
  level: INFO
  handlers: [console, file]

# Content filtering rules
content_filtering:
  # Maximum characters for different content types
  max_chars:
    prompt: 200
    response: 300
    tool_args: 150
    tool_output: 200
    error_message: 500
  
  # Sensitive patterns to mask
  sensitive_patterns:
    - "sk-[a-zA-Z0-9\\-_]{10,}"  # OpenAI API keys
    - "Bearer [a-zA-Z0-9\\-_]{10,}"  # Bearer tokens
    - "token[\"\\s:=]+[a-zA-Z0-9\\-_]{10,}"  # Generic tokens
    - "password[\"\\s:=]+[^\\s\"']{4,}"  # Passwords
  
  # Content types that should be summarized instead of logged verbatim
  summarize_content_types:
    - prompt
    - response
    - tool_output
    - file_content
    - chat_history
    - memory_retrieval

# Performance logging thresholds
performance_thresholds:
  slow_model_call: 5.0  # Log WARNING if model call takes > 5 seconds
  slow_tool_execution: 3.0  # Log WARNING if tool takes > 3 seconds
  slow_memory_retrieval: 1.0  # Log WARNING if memory retrieval takes > 1 second
  large_prompt: 10000  # Log WARNING if prompt exceeds 10k characters
  large_response: 5000  # Log WARNING if response exceeds 5k characters

# Log rotation and cleanup
rotation:
  max_file_size: "50MB"
  backup_count: 10
  cleanup_older_than_days: 30
  compress_old_logs: true
